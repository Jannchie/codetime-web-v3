shellEmulator: true

# pnpm 11 ignores pnpm-specific keys in .npmrc; `shamefully-hoist=true`
# must live here or installs prune the public-hoisted symlinks that
# uno.config.ts ('unocss') and friends rely on.
shamefullyHoist: true

trustPolicy: no-downgrade

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - esbuild
  - sharp

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  sharp: true
  vue-demi: true
